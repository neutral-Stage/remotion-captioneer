name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Validate docs
        run: npm run validate:docs

      - name: Install Playwright browser
        run: npm run test:e2e:install

      - name: Build
        run: npm run build

      - name: E2E smoke tests
        run: npm run test:e2e

      - name: Publish to npm
        # Idempotent: a manual publish (or an expired NPM_TOKEN) must not
        # fail the run when the version is already on the registry.
        run: |
          if npm view remotion-captioneer@$(node -p "require('./package.json').version") version >/dev/null 2>&1; then
            echo "Version already published on npm — skipping publish."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
